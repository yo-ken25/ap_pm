<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF 縦スクロールビューア</title>
    <!-- PDF.js の読み込み (CDN) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        // workerのパスを設定
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #525659;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
        }
        #toolbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 50px;
            background-color: #323639;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            z-index: 1000;
        }
        #toolbar input[type="file"] {
            color: #fff;
        }
        #viewer-container {
            margin-top: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            gap: 20px;
        }
        .page-wrapper {
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            background-color: #fff;
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
        }
        .page-number {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 2px 6px;
            font-size: 12px;
            border-radius: 4px;
            pointer-events: none;
        }
        #loading {
            text-align: center;
            margin-top: 100px;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div id="toolbar">
        <div>
            <strong>PDF 縦スクロールビューア</strong>
        </div>
        <div>
            <input type="file" id="file-input" accept="application/pdf">
        </div>
    </div>

    <div id="viewer-container">
        <div id="loading">上の「ファイルを選択」からPDFを選んでください<br>（または初期PDFを読み込みます）</div>
    </div>

    <script>
        const container = document.getElementById('viewer-container');
        const fileInput = document.getElementById('file-input');

        // デフォルトで同じフォルダにあるPDFを読み込む場合、ファイル名を指定してください
        // 例: const DEFAULT_PDF_URL = '2025r07h_ap_pm_qs.pdf';
        const DEFAULT_PDF_URL = '2025r07h_ap_pm_qs.pdf'; 

        async function loadPdf(urlOrData) {
            container.innerHTML = '<div id="loading">PDFを読み込んでいます...</div>';
            try {
                const loadingTask = pdfjsLib.getDocument(urlOrData);
                const pdfDoc = await loadingTask.promise;
                
                container.innerHTML = ''; // 読み込み表示をクリア

                // 全ページを順番にレンダリングして縦に並べる
                for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
                    const page = await pdfDoc.getPage(pageNum);
                    
                    const wrapper = document.createElement('div');
                    wrapper.className = 'page-wrapper';
                    
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    
                    // 画面幅や解像度にあわせたスケール調整 (初期表示幅としてスマホ等で見やすいように調整)
                    const viewport = page.getViewport({ scale: 1.5 });
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    const renderContext = {
                        canvasContext: context,
                        viewport: viewport
                    };

                    await page.render(renderContext).promise;

                    const pageNumDiv = document.createElement('div');
                    pageNumDiv.className = 'page-number';
                    pageNumDiv.textContent = `${pageNum} / ${pdfDoc.numPages}`;

                    wrapper.appendChild(canvas);
                    wrapper.appendChild(pageNumDiv);
                    container.appendChild(wrapper);
                }
            } catch (error) {
                console.error(error);
                container.innerHTML = '<div id="loading">PDFの読み込みに失敗しました。<br>同じフォルダにPDFファイルがあるか、ファイル選択から読み込んでください。</div>';
            }
        }

        // ファイルが選択されたときの処理
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const fileReader = new FileReader();
                fileReader.onload = function() {
                    const typedarray = new Uint8Array(this.result);
                    loadPdf(typedarray);
                };
                fileReader.readAsArrayBuffer(file);
            }
        });

        // ページ読み込み時にデフォルトPDFがあれば自動読み込み試行
        if (DEFAULT_PDF_URL) {
            loadPdf(DEFAULT_PDF_URL);
        }
    </script>
</body>
</html>
